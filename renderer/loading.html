<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DS-AgentShell</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: #0f1115;
        color: #e7e9ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4d6bfe 0%, #1f2a6b 100%);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 40px rgba(77, 107, 254, 0.35);
      }
      .logo svg {
        width: 44px;
        height: 44px;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .subtitle {
        font-size: 13px;
        color: #8b91a0;
      }
      .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 16 L31 25 L19 34" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="33" y="30" width="8" height="4.5" rx="2" fill="#ffffff"/></svg>
      </div>
      <div class="title">DS-AgentShell</div>
      <div class="subtitle">正在启动本地服务…</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
